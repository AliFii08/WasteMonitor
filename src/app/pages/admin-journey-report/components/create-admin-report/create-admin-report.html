@if (visible) {
  <div class="modal-backdrop" [class.is-closing]="isClosing" (click)="close()">
    <section class="modal-panel" [class.is-closing]="isClosing" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <header class="modal-header">
        <div><span>INFORME ADMINISTRATIVO</span><h2>Crear informe diario</h2></div>
        <button type="button" class="close-btn" (click)="close()" aria-label="Cerrar"><i class="pi pi-times"></i></button>
      </header>
      <form class="modal-body" (ngSubmit)="submit()">
        <label>Fecha de la jornada<input type="date" name="fecha" [(ngModel)]="fecha" (ngModelChange)="escucharResumenFecha()" required /></label>
        <div class="summary-grid">
          <label><span>Toneladas del día</span><input type="number" name="toneladasTotales" [ngModel]="toneladasTotales" readonly step="0.01" /></label>
          <label><span>Viajes registrados</span><input type="number" name="viajesTotales" [ngModel]="viajesTotales" readonly /></label>
          <label><span>Informes cerrados</span><input type="number" name="informesFinalizados" [ngModel]="informesFinalizados" readonly /></label>
        </div>
        @if (loadingResumen) { <p class="summary-status">Actualizando con jornadas finalizadas...</p> }
        @if (!loadingResumen && resumenCargado && informesFinalizados === 0) { <p class="summary-status">Aún no hay informes cerrados para esta fecha.</p> }
        <label>Observaciones<textarea name="observaciones" [(ngModel)]="observaciones" rows="4" placeholder="Anota decisiones, incidencias u organización pendiente..."></textarea></label>
        @if (error) { <p class="error">{{ error }}</p> }
        <footer class="modal-footer">
          <button type="button" class="btn-cancel" (click)="close()">Cancelar</button>
          <button type="submit" class="btn-submit" [disabled]="saving || loadingResumen || !resumenCargado || !fecha">{{ saving ? 'Guardando...' : 'Crear informe' }}</button>
        </footer>
      </form>
    </section>
  </div>
}
