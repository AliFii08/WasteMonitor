@if (visible && queja) {
  <div class="modal-backdrop" [class.is-closing]="isClosing" (click)="cerrarModal()">
    <div class="modal-panel" [class.is-closing]="isClosing" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
      <header class="modal-header">
        <div class="modal-title">
          <i class="pi pi-pencil"></i>
          <h2>Actualizar Estado de la Queja</h2>
        </div>
        <button type="button" class="close-btn" (click)="cerrarModal()" aria-label="Cerrar">
          <i class="pi pi-times"></i>
        </button>
      </header>

      <form [formGroup]="form" (ngSubmit)="guardarCambios()" class="modal-body">
        <div class="info-card">
          <span class="info-label">Asunto</span>
          <strong>{{ queja.asunto }}</strong>
        </div>

        <div class="form-field">
          <label for="estado">Estado de la Atención</label>
          <select id="estado" formControlName="estado">
            <option value="" disabled>Seleccione un estado</option>
            @for (opcion of opcionesEstado; track opcion.value) {
              <option [value]="opcion.value">{{ opcion.label }}</option>
            }
          </select>
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn-cancel" (click)="cerrarModal()" [disabled]="loading">
            <i class="pi pi-times"></i> Cancelar
          </button>
          <button type="submit" class="btn-submit" [disabled]="loading">
            @if (loading) { <i class="pi pi-spin pi-spinner"></i> Actualizando... }
            @else { <i class="pi pi-check"></i> Actualizar }
          </button>
        </footer>
      </form>
    </div>
  </div>
}
