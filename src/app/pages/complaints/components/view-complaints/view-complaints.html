@if (visible && queja) {
  <div class="modal-backdrop" [class.is-closing]="isClosing" (click)="cerrarModal()">
    <div class="modal-panel" [class.is-closing]="isClosing" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
      <header class="modal-header">
        <div class="modal-title"><i class="pi pi-eye"></i><h2>Detalle de la Queja</h2></div>
        <button type="button" class="close-btn" (click)="cerrarModal()" aria-label="Cerrar"><i class="pi pi-times"></i></button>
      </header>
      <div class="modal-body">
        <div class="detail-group"><label>Asunto</label><p class="detail-value title-value">{{ queja.asunto }}</p></div>
        <div class="detail-group"><label>Estado</label><p-tag [value]="queja.estado" [severity]="getSeverity(queja.estado)"></p-tag></div>
        <div class="detail-group"><label>Descripción</label><p class="description-value">{{ queja.descripcion }}</p></div>
        <div class="metadata">
          <div><label>Fecha de creación</label><strong>{{ queja.fecha | date:'dd/MM/yyyy HH:mm' }}</strong></div>
          <div><label>Creado por</label><strong>{{ nombreUsuario() }}</strong></div>
        </div>
      </div>
      <footer class="modal-footer"><button type="button" class="btn-cancel" (click)="cerrarModal()"><i class="pi pi-times"></i> Cerrar</button></footer>
    </div>
  </div>
}
