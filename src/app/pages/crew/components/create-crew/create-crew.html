@if (visible) {
  <div class="modal-backdrop" [class.is-closing]="isClosing" (click)="cerrarModal()">
    <div class="modal-panel" [class.is-closing]="isClosing" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
      <header class="modal-header">
        <div class="modal-title">
          <i class="pi pi-users"></i>
          <h2>Crear Grupo de Tripulación</h2>
        </div>
        <button type="button" class="close-btn" (click)="cerrarModal()" aria-label="Cerrar">
          <i class="pi pi-times"></i>
        </button>
      </header>

      <form (ngSubmit)="onSubmit()" class="modal-body" #f="ngForm">
        <!-- Supervisor -->
        <div class="form-field">
          <label for="supervisorUid">Supervisor <span class="req">*</span></label>
          <select
            id="supervisorUid"
            name="supervisorUid"
            [(ngModel)]="form.supervisorUid"
            required
            [disabled]="saving || loadingData"
          >
            <option value="" disabled selected>
              {{ loadingData ? 'Cargando supervisores...' : 'Seleccione un supervisor' }}
            </option>
            @for (u of supervisoresDisponibles; track u.uid) {
              <option [value]="u.uid" [disabled]="u.asignado">
                {{ u.nombreCompleto }} {{ u.asignado ? '(Ya asignado)' : '' }}
              </option>
            }
          </select>
        </div>

        <!-- Conductor -->
        <div class="form-field">
          <label for="conductorUid">Conductor</label>
          <select
            id="conductorUid"
            name="conductorUid"
            [(ngModel)]="form.conductorUid"
            [disabled]="saving || loadingData"
          >
            <option value="">Sin conductor asignado</option>
            @for (u of conductoresDisponibles; track u.uid) {
              <option [value]="u.uid" [disabled]="u.asignado">
                {{ u.nombreCompleto }} {{ u.asignado ? '(Ya asignado)' : '' }}
              </option>
            }
          </select>
        </div>

        <!-- Integrantes de Crew -->
        <div class="form-field">
          <label>Crew (máximo 4)</label>
          <div class="crew-options">
            @for (u of crewDisponibles; track u.uid) {
              <label class="crew-option" [class.is-disabled]="u.asignado">
                <input
                  type="checkbox"
                  [checked]="form.crewUids.includes(u.uid)"
                  [disabled]="saving || loadingData || u.asignado || (!form.crewUids.includes(u.uid) && form.crewUids.length >= 4)"
                  (change)="toggleCrew(u.uid, $any($event.target).checked)"
                />
                <span>{{ u.nombreCompleto }} {{ u.asignado ? '(Ya asignado)' : '' }}</span>
              </label>
            }
          </div>
        </div>

        <!-- Vehículo -->
        <div class="form-field">
          <label for="idCamion">Vehículo / Camión <span class="req">*</span></label>
          <select
            id="idCamion"
            name="idCamion"
            [(ngModel)]="form.idCamion"
            required
            [disabled]="saving || loadingData"
          >
            <option value="" disabled selected>
              {{ loadingData ? 'Cargando vehículos...' : 'Seleccione un vehículo' }}
            </option>
            @for (c of camionesDisponibles; track c.idKey) {
              <option [value]="c.idKey" [disabled]="c.asignado">
                {{ c.idKey }} — {{ c.placa || 'Sin placa' }} ({{ c.tipo || 'N/A' }}) {{ c.asignado ? '(Ya asignado)' : '' }}
              </option>
            }
          </select>
        </div>

        @if (errorMsg) {
          <div class="error-msg">
            <i class="pi pi-exclamation-triangle"></i>
            {{ errorMsg }}
          </div>
        }

        <footer class="modal-footer">
          <button type="button" class="btn-cancel" (click)="cerrarModal()" [disabled]="saving">
            Cancelar
          </button>
          <button
            type="submit"
            class="btn-submit"
            [disabled]="saving || loadingData || !form.supervisorUid || !form.idCamion || form.crewUids.length > 4"
          >
            @if (saving) {
              <i class="pi pi-spin pi-spinner"></i>
              Guardando...
            } @else {
              <i class="pi pi-check"></i>
              Crear grupo
            }
          </button>
        </footer>
      </form>
    </div>
  </div>
}
