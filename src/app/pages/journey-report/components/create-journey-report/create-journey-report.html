@if (visible) {
  <div class="modal-backdrop" (click)="closeModal()">
    <div class="modal-panel" (click)="$event.stopPropagation()">
      <header class="modal-header">
        <div class="modal-title">
          <i class="pi pi-file-plus"></i>
          <h2>Crear Informe de Jornada</h2>
        </div>
        <button type="button" class="close-btn" (click)="closeModal()" aria-label="Cerrar">
          <i class="pi pi-times"></i>
        </button>
      </header>

      <form (ngSubmit)="onSubmit()" class="modal-body" #f="ngForm">
        <div class="trip-header">
          <span class="trip-title">Nueva Jornada de Viaje</span>
        </div>

        <p class="info-text">
          Se creará la cabecera del informe de jornada asignado a tu usuario y vehículo activo.
        </p>

        <footer class="modal-footer">
          <button type="button" class="btn-cancel" (click)="closeModal()">Cancelar</button>
          <button type="submit" class="btn-submit" [disabled]="loading">
            <i class="pi pi-check"></i>
            {{ loading ? 'Guardando...' : 'Iniciar Jornada' }}
          </button>
        </footer>
      </form>
    </div>
  </div>
}

@if (showErrorModal) {
  <div class="modal-backdrop error-backdrop" (click)="closeErrorModal()">
    <div class="error-panel" (click)="$event.stopPropagation()">
      <div class="error-icon">
        <i class="pi pi-exclamation-triangle"></i>
      </div>
      
      <h3>Atención</h3>
      <p>{{ errorMessage }}</p>

      <button type="button" class="btn-error-close" (click)="closeErrorModal()">
        Entendido
      </button>
    </div>
  </div>
}
