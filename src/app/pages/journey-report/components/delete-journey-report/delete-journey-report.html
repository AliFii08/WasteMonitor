@if (visible) {
  <div class="modal-backdrop" (click)="closeModal()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="icon-warning">
          <i class="pi pi-exclamation-triangle"></i>
        </div>
        <h2>Ocultar Informe</h2>
      </div>

      <div class="modal-body">
        <p>
          @if (listaAEliminar.length > 1) {
            ¿Estás seguro de que deseas ocultar los <strong>{{ listaAEliminar.length }}</strong> informes seleccionados?
          } @else {
            ¿Estás seguro de que deseas ocultar este informe de viaje?
          }
        </p>
        <span class="subtext">El registro ya no estará visible en la lista principal.</span>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="closeModal()" [disabled]="isDeleting">
          Cancelar
        </button>
        <button type="button" class="btn-danger" (click)="confirmDelete()" [disabled]="isDeleting">
          {{ isDeleting ? 'Ocultando...' : 'Confirmar y Ocultar' }}
        </button>
      </div>
    </div>
  </div>
}
