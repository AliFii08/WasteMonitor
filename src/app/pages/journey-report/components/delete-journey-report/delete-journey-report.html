@if (visible) {
  <div class="confirmation-backdrop" [class.is-closing]="isClosing" (click)="closeModal()">
    <div class="confirmation-modal" [class.is-closing]="isClosing" (click)="$event.stopPropagation()">
      <header class="confirmation-header">
        <div class="confirmation-title">
          <i class="pi pi-exclamation-triangle"></i>
          <h2>Confirmar eliminación</h2>
        </div>
        <button type="button" class="close-btn" (click)="closeModal()" aria-label="Cerrar">
          <i class="pi pi-times"></i>
        </button>
      </header>

      <div class="confirmation-body">
        <p>
          @if (listaAEliminar.length > 1) {
            ¿Estás seguro de que deseas ocultar los <strong>{{ listaAEliminar.length }}</strong> informes seleccionados?
          } @else {
            ¿Estás seguro de que deseas ocultar este informe de viaje?
          }
        </p>
        <span class="confirmation-subtext">El registro ya no estará visible en la lista principal.</span>
      </div>

      <div class="confirmation-footer">
        <button type="button" class="btn-cancel" (click)="closeModal()" [disabled]="isDeleting">
          Cancelar
        </button>
        <button type="button" class="confirmation-danger" (click)="confirmDelete()" [disabled]="isDeleting">
          {{ isDeleting ? 'Ocultando...' : 'Confirmar y Ocultar' }}
        </button>
      </div>
    </div>
  </div>
}
