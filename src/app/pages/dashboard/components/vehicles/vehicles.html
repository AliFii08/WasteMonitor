<div class="chart-panel">
	<div class="chart-heading">
		<div>
			<h2>Vehículos de la flota</h2>
			<p>Distribución de la flota registrada</p>
		</div>
		<strong>{{ total }}</strong>
	</div>

	@if (loading) {
		<div class="chart-loading" role="status" aria-label="Cargando datos">
			<div class="spinner"></div>
		</div>
	} @else if (error) {
		<p class="chart-state" role="alert">{{ error }}</p>
	} @else {
		<div class="bar-chart" aria-label="Vehículos por tipo">
			@for (item of items; track item.label) {
				<div class="bar-row">
					<div class="bar-value">{{ item.count }}<small>{{ item.percentage | number: '1.0-0' }}%</small></div>
					<div class="bar-track"><span [style.height.%]="item.percentage" [style.--bar-width]="item.percentage + '%' "></span></div>
					<div class="bar-label">{{ item.label }}</div>
				</div>
			}
		</div>
	}
</div>
