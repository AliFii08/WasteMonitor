@if (visible) {
    <div class="modal-backdrop" (click)="cerrarModal()">
      <div class="modal-panel" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
        <header class="modal-header">
          <div class="modal-title">
            <i class="pi pi-user-edit"></i>
            <h2>Editar Conductor</h2>
          </div>
          <button type="button" class="close-btn" (click)="cerrarModal()" aria-label="Cerrar">
            <i class="pi pi-times"></i>
          </button>
        </header>
  
        <form (ngSubmit)="onSubmit()" class="modal-body" #f="ngForm">
          <!-- Información de Solo Lectura -->
          <div class="driver-info-card">
            <span class="info-label">Conductor</span>
            <strong>{{ driverData?.nombreCompleto || 'Cargando...' }}</strong>
            <small>ID: {{ driverData?.driverId || 'N/A' }}</small>
          </div>
  
          <!-- Select de Rol / Cargo -->
          <div class="form-field">
            <label for="rol">Rol / Cargo <span class="req">*</span></label>
            <select
              id="rol"
              name="rol"
              [(ngModel)]="form.rol"
              required
              [disabled]="saving"
            >
              <option value="crew">Crew</option>
              <option value="supervisor">Supervisor</option>
            </select>
          </div>
  
          <!-- Select de Vehículos Disponibles -->
          <div class="form-field">
            <label for="idCamion">Vehículo / Camión <span class="req">*</span></label>
            <select
              id="idCamion"
              name="idCamion"
              [(ngModel)]="form.idCamion"
              required
              [disabled]="saving || loadingCamiones"
            >
              <option value="" disabled selected>
                {{ loadingCamiones ? 'Cargando vehículos...' : 'Seleccione un vehículo' }}
              </option>
              @for (c of camionesDisponibles; track c.idKey) {
                <option [value]="c.idKey">
                  {{ c.idKey }} — {{ c.placa || 'Sin placa' }} ({{ c.tipo || 'N/A' }})
                </option>
              }
            </select>
            @if (!loadingCamiones && camionesDisponibles.length === 0) {
              <small class="hint">No hay vehículos disponibles fuera de taller.</small>
            }
          </div>
  
          @if (errorMsg) {
            <div class="error-msg">
              <i class="pi pi-exclamation-triangle"></i>
              {{ errorMsg }}
            </div>
          }
  
          <footer class="modal-footer">
            <button type="button" class="btn-cancel" (click)="cerrarModal()" [disabled]="saving">
              Cancelar
            </button>
            <button
              type="submit"
              class="btn-submit"
              [disabled]="saving || !form.rol || !form.idCamion"
            >
              @if (saving) {
                <i class="pi pi-spin pi-spinner"></i>
                Guardando...
              } @else {
                <i class="pi pi-check"></i>
                Actualizar Conductor
              }
            </button>
          </footer>
        </form>
      </div>
    </div>
  }
