<main class="not-found-page">
  <header class="brand" aria-label="WasteMonitor">
    <span class="brand-mark" aria-hidden="true">
      <i class="pi pi-replay"></i>
    </span>
    <span class="brand-name">Waste<span>Monitor</span></span>
  </header>

  <section class="not-found-card" aria-labelledby="not-found-title">
    <div class="illustration" aria-hidden="true">
      <span class="illustration-orbit illustration-orbit--one"></span>
      <span class="illustration-orbit illustration-orbit--two"></span>
      <span class="illustration-spark illustration-spark--one">✳</span>
      <span class="illustration-spark illustration-spark--two">✦</span>
      <div class="illustration-number">404</div>
      <div class="illustration-pin">
        <i class="pi pi-map-marker"></i>
        <span class="pin-leaf"><i class="pi pi-leaf"></i></span>
      </div>
      <span class="illustration-path"></span>
    </div>

    <div class="message">
      <p class="eyebrow"><span></span> Parece que nos desviamos</p>
      <h1 id="not-found-title">No se encontró esta página</h1>
      <p class="description">
        La ruta que buscas no existe o cambió de lugar. No te preocupes, te ayudamos a volver al camino.
      </p>
      <a class="home-button" routerLink="/">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        Volver al inicio
      </a>
      <p class="help-note">Revisa la dirección o regresa a la página principal.</p>
    </div>
  </section>

  <footer class="page-footer">
    <i class="pi pi-leaf" aria-hidden="true"></i>
    <span>Cada ruta cuenta para cuidar nuestro planeta.</span>
  </footer>
</main>
