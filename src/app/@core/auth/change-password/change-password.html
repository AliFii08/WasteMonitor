<main class="recovery-page">
  <section class="visual-panel" aria-label="WasteMonitor">
    <div class="brand-square">
      <div class="form-content">
        <a class="back-link" routerLink="/login">
          <span aria-hidden="true">←</span> Volver al inicio de sesión
        </a>

        <div class="heading">
          <h2>Recuperar contraseña</h2>
          <p>Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
        </div>

        <form (ngSubmit)="onSendResetLink()">
          <div class="field-group">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" [(ngModel)]="email"
              placeholder="correo@ejemplo.com" autocomplete="email" required />
          </div>

          <button type="submit" [disabled]="loading || !email">
            <span>{{ loading ? 'Enviando enlace...' : 'Enviar enlace' }}</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </form>

      </div>
    </div>
    <div class="word word-waste">WASTE</div>
    <div class="word word-monitor">MONITOR</div>
    <div class="brand-line line-left"></div>
    <div class="brand-line line-right"></div>
  </section>
</main>
