<div style="padding: 20px; max-width: 400px; margin: 0 auto; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Recuperar Contraseña</h2>

  <p>Ingresa tu correo para recibir un enlace de restablecimiento:</p>
  
  <input 
    type="email" 
    [(ngModel)]="email" 
    placeholder="correo@ejemplo.com" 
    style="width: 100%; padding: 8px; margin-bottom: 10px;" 
  />

  <button 
    (click)="onSendResetLink()" 
    [disabled]="loading || !email" 
    style="padding: 8px 16px;">
    {{ loading ? 'Enviando...' : 'Enviar enlace de recuperación' }}
  </button>

  <div *ngIf="message" [style.color]="isError ? 'red' : 'green'" style="margin-top: 15px;">
    {{ message }}
  </div>
</div>
